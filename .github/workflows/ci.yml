name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read Gradle version
        id: gradle_version
        run: |
          version="$(grep -E '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties \
            | sed -E 's/.*gradle-([0-9.]+)-bin\.zip/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Gradle version: ${version}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version ${{ steps.gradle_version.outputs.version }} --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests (debug variant)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android Lint (debug variant)
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Lint summary
        if: always()
        run: |
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "::warning title=Android Lint::lintDebug нашёл ошибки — см. артефакт lint-reports."
          else
            echo "Lint прошёл без ошибок."
          fi
